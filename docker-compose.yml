  app:
    depends_on:
      # - postgresql
      - redis
    container_name: data-gen-hub-be
    build:
      context: .
      dockerfile: Dockerfile-development
    env_file:
      - env/.env.development
    ports:
      - 8080:8080
    restart: unless-stopped

  redis:
    image: redis:alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    env_file:
      - env/.env.development
    ports:
      - 6379:6379

